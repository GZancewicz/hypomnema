<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypomnema - Bible Reader</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2HFPF0EN9M"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-2HFPF0EN9M');
    </script>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/preload.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=92">
    <style>
        /* Sidebar toggle icon states */
        .sidebar-toggle svg {
            display: block;
        }
        
        /* Transition for the sidebar indicator */
        .sidebar-indicator {
            transition: opacity 0.2s ease;
        }
        
        /* When sidebar is collapsed, hide the indicator */
        .container.sidebar-collapsed .sidebar-indicator {
            opacity: 0;
        }
        
        /* Sidebar overlay */
        #sidebarOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
        }
        
        /* Hamburger icon for narrow viewports */
        @media (max-width: 700px) {
            .sidebar-toggle svg {
                display: none;
            }
            
            .sidebar-toggle::after {
                content: '';
                display: block;
                width: 24px;
                height: 2px;
                background: #666;
                box-shadow: 0 8px 0 #666, 0 16px 0 #666;
            }
        }
        
        /* Search container animation */
        .search-container {
            animation: slideDown 0.2s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Chapter selector styles */
        .chapter-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px 20px;
            justify-content: center;
            max-width: 100%;
        }
        
        .chapter-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #333;
            text-decoration: none;
        }
        
        .chapter-box:hover {
            border-color: #007bff;
            background: #f0f8ff;
            transform: scale(1.05);
        }
        
        .chapter-box.active {
            background: #f5f5f5;
            color: #7f8c8d;
            border-color: #7f8c8d;
            font-weight: bold;
        }
        
        .chapter-box.active:hover {
            background: #ebebeb;
            border-color: #6a7576;
        }
        
        /* Responsive adjustments */
        @media (max-width: 700px) {
            .chapter-selector {
                padding: 10px 15px;
            }
            
            .chapter-box {
                width: 35px;
                height: 35px;
                font-size: 13px;
            }
        }
        
        /* Search toggle button */
        #search-toggle:hover {
            transform: scale(1.05);
        }
        
        /* Accordion styles */
        .accordion {
            margin-bottom: 20px;
        }
        
        .accordion-header {
            cursor: pointer;
            user-select: none;
            padding: 10px 15px;
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
        }
        
        .accordion-header:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .accordion-icon {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 12px;
        }
        
        .accordion-icon.collapsed {
            transform: rotate(-90deg);
        }
        
        .accordion-content {
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }
        
        .accordion-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
        
        .accordion-content ul {
            margin: 0;
            padding: 0;
        }
        
        /* Nested accordion styles */
        .accordion.nested {
            margin: 0;
        }
        
        .accordion-header.nested {
            padding: 8px 15px 8px 25px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .accordion-header.author {
            padding: 6px 15px 6px 35px;
            font-size: 13px;
            font-weight: 400;
            font-style: italic;
        }
        
        /* Synaxarion browse page */
        .synaxarion-page .synax-search-wrap {
            margin-bottom: 24px;
        }
        .synaxarion-page .synax-search {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }
        .synaxarion-page .synax-search:focus {
            outline: none;
            border-color: #2185d0;
        }
        .synaxarion-page .synax-search-count {
            margin-top: 6px;
            font-size: 13px;
            color: #999;
            min-height: 16px;
        }
        .synaxarion-page .synax-month {
            border-bottom: 1px solid #e5e5e5;
        }
        .synaxarion-page .synax-month-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 14px 4px;
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            text-align: left;
            font-family: inherit;
        }
        .synaxarion-page .synax-month-header:hover {
            color: #2185d0;
        }
        .synaxarion-page .synax-caret {
            display: inline-block;
            font-size: 12px;
            color: #999;
            transition: transform 0.2s ease;
        }
        .synaxarion-page .synax-month-header.open .synax-caret {
            transform: rotate(90deg);
        }
        .synaxarion-page .synax-month-name {
            flex: 1;
        }
        .synaxarion-page .synax-month-count {
            font-size: 13px;
            font-weight: 400;
            color: #999;
        }
        .synaxarion-page .synax-month-body {
            padding: 4px 0 16px 22px;
        }
        .synaxarion-page .synax-day {
            margin-bottom: 14px;
        }
        .synaxarion-page .synax-day-label {
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .synaxarion-page .synax-saints {
            list-style: none;
            margin: 0;
            padding: 0 0 0 12px;
        }
        .synaxarion-page .synax-saints li {
            margin: 3px 0;
        }
        .synaxarion-page .synax-saints a {
            color: #2185d0;
            text-decoration: none;
            cursor: pointer;
            line-height: 1.4;
        }
        .synaxarion-page .synax-saints a:hover {
            text-decoration: underline;
        }

        /* Homily list styles */
        .homily-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .homily-list.expanded {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .homily-item {
            padding: 6px 15px 6px 45px;
            cursor: pointer;
            color: #ccc;
            font-size: 12px;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .homily-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .homily-item.show-more {
            font-style: italic;
            color: #999;
        }
        
        .homily-item.show-more:hover {
            color: #fff;
        }
        
        .homily-item.extra-item {
            display: none;
        }
        
        .homily-list.expanded .homily-item.extra-item {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="book-list">
                <!-- Home Button -->
                <div style="padding: 15px; display: flex; justify-content: center;">
                    <button id="home-button" onclick="loadIndex()"
                            style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"
                            onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.5)'"
                            onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0.1)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'"
                            title="Home">
                        <img src="/static/favicon.svg" width="24" height="24" style="filter: brightness(0) invert(1) opacity(0.8);" alt="Home">
                    </button>
                </div>

                <ul style="margin-bottom: 20px;">
                    <li class="book-item" onclick="loadAbout(event)">
                        About/Donate
                    </li>
                    <li class="book-item" onclick="loadIndex(event)">
                        COMMENTARIES
                    </li>
                    <li class="book-item" onclick="loadHarmony(event)">
                        EUSEBIAN
                    </li>
                    <li class="book-item" onclick="loadSynaxarion(event)">
                        SYNAXARION
                    </li>
                </ul>
                <div class="accordion">
                    <h3 class="accordion-header" onclick="toggleAccordion(this)">
                        <span class="accordion-icon collapsed">▼</span>New Testament
                    </h3>
                    <div class="accordion-content collapsed">
                        <!-- Search Toggle Button -->
                        <div style="padding: 10px 15px; display: flex; justify-content: center;">
                            <button id="search-toggle" onclick="toggleSearch()"
                                    style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"
                                    onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.5)'"
                                    onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0.1)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- Search Box (initially hidden) -->
                        <div id="search-container" class="search-container" style="padding: 0 15px 15px 15px; display: none;">
                            <div style="position: relative;">
                                <input type="search"
                                       id="verse-search"
                                       placeholder="Search verses..."
                                       hx-get="/api/search"
                                       hx-trigger="keyup changed delay:500ms"
                                       hx-target="#search-results"
                                       hx-indicator="#search-indicator"
                                       name="q"
                                       style="width: 100%; padding: 8px 35px 8px 8px; border: 1px solid #ddd; border-radius: 4px;">
                                <button onclick="closeSearch()"
                                        style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 5px; color: #666;"
                                        onmouseover="this.style.color='#333'"
                                        onmouseout="this.style.color='#666'">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                            <div id="search-indicator" class="htmx-indicator" style="text-align: center; padding: 5px;">
                                <small>Searching...</small>
                            </div>
                            <div id="search-results"></div>
                        </div>

                        <ul hx-boost="true" hx-target="#text-content" hx-swap="innerHTML" hx-ext="preload">
                            {{range .Books}}
                            <li class="book-item {{if eq $.CurrentBook .ID}}active{{end}}" 
                                data-book-id="{{.ID}}"
                                hx-get="/api/chapter/{{.ID}}/1"
                                hx-target="#text-content"
                                hx-swap="innerHTML show:window:top"
                                hx-push-url="/{{.ID}}/1"
                                hx-indicator="#loading-indicator"
                                preload="mousedown">
                                {{.Name}}
                            </li>
                            {{end}}
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        
        <!-- Main content -->
        <main class="content">
            <header class="content-header">
                <button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect class="sidebar-rect" x="4" y="4" width="16" height="16" fill="white" stroke="#ddd" stroke-width="1" rx="2"></rect>
                        <rect class="sidebar-indicator" x="4" y="4" width="6" height="16" fill="#999" rx="0"></rect>
                        <line class="sidebar-indicator" x1="5" y1="6.5" x2="9" y2="6.5" stroke="#ddd" stroke-width="0.8"></line>
                        <line class="sidebar-indicator" x1="5" y1="8.5" x2="9" y2="8.5" stroke="#ddd" stroke-width="0.8"></line>
                        <line class="sidebar-indicator" x1="5" y1="10.5" x2="9" y2="10.5" stroke="#ddd" stroke-width="0.8"></line>
                        <line class="sidebar-indicator" x1="5" y1="12.5" x2="8" y2="12.5" stroke="#ddd" stroke-width="0.8"></line>
                    </svg>
                </button>
                <h1 id="book-title">Commentary Index</h1>

                <!-- Chapter selector -->
                <div id="chapter-selector" class="chapter-selector" hx-ext="preload">
                    <!-- Empty by default, populated only when viewing scripture -->
                </div>

                <h2 id="chapter-title"></h2>
            </header>
            
            <div id="text-content">
                <!-- Content will be loaded here -->
            </div>
            
            <footer class="content-footer">
                <!-- Bottom chapter selector -->
                <div id="chapter-selector-bottom" class="chapter-selector" hx-ext="preload">
                    <!-- Empty by default, populated only when viewing scripture -->
                </div>
            </footer>
        </main>
        
        <!-- Homily Panel -->
        <aside id="homilyPanel" class="homily-panel">
            <div class="homily-panel-header">
                <div>
                    <div id="homilyAuthor" class="homily-author">John Chrysostom</div>
                    <h2 id="homilyTitle">Homily</h2>
                    <div id="homilyRange" class="homily-range"></div>
                </div>
                <button class="close-btn" onclick="closeHomilyPanel()">×</button>
            </div>
            <div id="homilyContent" class="homily-panel-content">
                <!-- Homily content will be loaded here -->
            </div>
        </aside>
    </div>
    
    <!-- Overlay for mobile sidebar -->
    <div id="sidebarOverlay" onclick="closeSidebarOverlay()"></div>
    
    <!-- Eusebian Canon Modal -->
    <div id="canonModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Canon References</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">Loading passages...</div>
            </div>
        </div>
    </div>
    
    <!-- Global loading indicator -->
    <div id="loading-indicator" class="htmx-indicator">
        <div class="loading-spinner"></div>
        <span>Loading...</span>
    </div>
    
    <script>
        let currentBook = '{{.CurrentBook}}';
        let currentChapter = {{.CurrentChap}};
        
        // Book chapter counts
        const bookChapters = {
            {{range .Books}}'{{.ID}}': {{.Chapters}},
            {{end}}
        };
        
        // Populate chapter selectors (both top and bottom)
        function populateChapterSelectors(bookId, currentChap) {
            const selectors = ['chapter-selector', 'chapter-selector-bottom'];
            
            if (!bookChapters[bookId]) return;
            
            const maxChapters = bookChapters[bookId];
            let html = '';
            
            for (let i = 1; i <= maxChapters; i++) {
                const activeClass = i === currentChap ? ' active' : '';
                html += `<div class="chapter-box${activeClass}"
                             onclick="loadChapterAndScroll('${bookId}', ${i})"
                             style="cursor: pointer;">${i}</div>`;
            }
            
            selectors.forEach(selectorId => {
                const selector = document.getElementById(selectorId);
                if (selector) {
                    selector.innerHTML = html;
                    htmx.process(selector); // Re-process HTMX attributes
                }
            });
        }
        
        // Populate on initial load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if we're on the home page
            const path = window.location.pathname;
            if (path === '/' || path === '') {
                // Wait for HTMX to be ready then load the Index page
                function tryLoadIndex() {
                    if (typeof htmx !== 'undefined') {
                        console.log('HTMX is ready, loading INDEX...');
                        loadIndex();
                    } else {
                        console.log('Waiting for HTMX...');
                        setTimeout(tryLoadIndex, 50);
                    }
                }
                tryLoadIndex();
            } else {
                // Load chapter content for book pages
                populateChapterSelectors(currentBook, currentChapter);
                // Load the chapter content
                const bookMatch = path.match(/\/([^\/]+)(?:\/(\d+))?/);
                if (bookMatch) {
                    const book = bookMatch[1];
                    const chapter = bookMatch[2] || '1';
                    htmx.ajax('GET', `/api/chapter/${book}/${chapter}`, '#text-content');
                }
            }
        });
        
        // Load chapter and scroll to top
        function loadChapterAndScroll(bookId, chapter) {
            // Try multiple scroll methods to ensure it works
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            
            // Also scroll the main content area if it exists
            const mainContent = document.querySelector('.content');
            if (mainContent) {
                mainContent.scrollTop = 0;
            }
            
            // Load the chapter content
            htmx.ajax('GET', `/api/chapter/${bookId}/${chapter}`, '#text-content');
            
            // Update URL
            history.pushState(null, '', `/${bookId}/${chapter}`);

            // Force another scroll after a brief delay
            setTimeout(() => {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            }, 50);
        }
        
        // Listen for HTMX events to update UI after content loads
        document.addEventListener('htmx:afterSwap', function(event) {
            // Check if this was a chapter load (the target will be text-content)
            if (event.detail.target && event.detail.target.id === 'text-content') {
                // Get the request path from the event
                let url = '';
                if (event.detail.requestConfig && event.detail.requestConfig.path) {
                    url = event.detail.requestConfig.path;
                } else if (event.detail.xhr && event.detail.xhr.responseURL) {
                    // Fallback to response URL from XMLHttpRequest
                    const responseUrl = event.detail.xhr.responseURL;
                    // Extract path from full URL
                    const urlObj = new URL(responseUrl);
                    url = urlObj.pathname;
                }
                
                const match = url.match(/\/api\/chapter\/([^\/]+)\/(\d+)/);
                
                if (match) {
                    currentBook = match[1];
                    currentChapter = parseInt(match[2]);
                    
                    // Update active book in sidebar
                    document.querySelectorAll('.book-item').forEach(item => {
                        item.classList.toggle('active', item.getAttribute('data-book-id') === currentBook);
                    });
                    
                    // Update book title
                    const activeBook = document.querySelector('.book-item.active');
                    if (activeBook) {
                        document.getElementById('book-title').textContent = activeBook.textContent.trim();
                    }
                    
                    // Auto-close sidebar on mobile
                    if (window.innerWidth <= 700) {
                        closeSidebarOverlay();
                    }
                }
            }
        });
        
        // Track desired sidebar state (what user wants)
        let desiredSidebarOpen = true;
        
        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
            }
        }
        
        function toggleAllHomilies(listId, book, author) {
            const list = document.getElementById(listId);
            const showMoreBtn = list.querySelector('.show-more');
            
            if (list.classList.contains('expanded')) {
                // Collapse - remove extra items
                const extraItems = list.querySelectorAll('.extra-item');
                extraItems.forEach(item => item.remove());
                list.classList.remove('expanded');
                
                // Update button text
                const total = book === 'matthew' ? 90 : (book === 'john' ? 88 : 153);
                const type = author === 'cyril' ? 'sermons' : 'homilies';
                showMoreBtn.textContent = `Show all ${total} ${type}...`;
            } else {
                // Expand - load from server
                showMoreBtn.textContent = 'Loading...';
                
                // Fetch the homilies and insert them
                fetch(`/api/homilies/${author}/${book}`)
                    .then(response => response.text())
                    .then(html => {
                        // Count how many items we're adding
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = html;
                        const itemCount = tempDiv.querySelectorAll('.homily-item').length;
                        console.log(`Received ${itemCount} homilies from server`);
                        
                        // Insert the HTML before the show more button
                        showMoreBtn.insertAdjacentHTML('beforebegin', html);
                        
                        // Count how many are now in the DOM
                        const totalItems = list.querySelectorAll('.homily-item:not(.show-more)').length;
                        console.log(`Total homilies in list: ${totalItems}`);
                        
                        list.classList.add('expanded');
                        showMoreBtn.textContent = 'Show less';
                    })
                    .catch(error => {
                        console.error('Error loading homilies:', error);
                        showMoreBtn.textContent = 'Error loading. Click to retry.';
                    });
            }
        }
        
        function toggleSearch() {
            const searchContainer = document.getElementById('search-container');
            const searchToggle = document.getElementById('search-toggle');
            const searchInput = document.getElementById('verse-search');
            
            if (searchContainer.style.display === 'none') {
                searchContainer.style.display = 'block';
                searchToggle.style.display = 'none';
                searchInput.focus();
            } else {
                searchContainer.style.display = 'none';
                searchToggle.style.display = 'flex';
                searchInput.value = '';
                document.getElementById('search-results').innerHTML = '';
            }
        }
        
        function closeSearch() {
            const searchContainer = document.getElementById('search-container');
            const searchToggle = document.getElementById('search-toggle');
            const searchInput = document.getElementById('verse-search');
            
            searchContainer.style.display = 'none';
            searchToggle.style.display = 'flex';
            searchInput.value = '';
            document.getElementById('search-results').innerHTML = '';
        }
        
        function showAllSearchResults(query) {
            // Create modal overlay
            const modal = document.createElement('div');
            modal.id = 'search-modal';
            modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
            
            // Create modal content container
            const modalContent = document.createElement('div');
            modalContent.style.cssText = 'background: white; width: 90%; max-width: 800px; max-height: 80vh; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;';
            
            // Create modal header
            const modalHeader = document.createElement('div');

        function filterSynaxarion(query) {
            const page = document.querySelector('.synaxarion-page');
            if (!page) return;
            const q = query.trim().toLowerCase();
            let matchCount = 0;

            page.querySelectorAll('.synax-month').forEach(month => {
                const body = month.querySelector('.synax-month-body');
                const header = month.querySelector('.synax-month-header');
                let monthHasMatch = false;

                month.querySelectorAll('.synax-day').forEach(day => {
                    let dayHasMatch = false;
                    day.querySelectorAll('.synax-saints li').forEach(li => {
                        const show = q === '' || li.textContent.toLowerCase().includes(q);
                        li.style.display = show ? '' : 'none';
                        if (show && q !== '') { dayHasMatch = true; matchCount++; }
                    });
                    if (q === '') {
                        day.style.display = '';
                    } else {
                        day.style.display = dayHasMatch ? '' : 'none';
                        if (dayHasMatch) monthHasMatch = true;
                    }
                });

                if (q === '') {
                    month.style.display = '';
                    body.setAttribute('hidden', '');
                    header.classList.remove('open');
                } else if (monthHasMatch) {
                    month.style.display = '';
                    body.removeAttribute('hidden');
                    header.classList.add('open');
                } else {
                    month.style.display = 'none';
                    body.setAttribute('hidden', '');
                    header.classList.remove('open');
                }
            });

            const countEl = document.getElementById('synax-search-count');
            if (countEl) {
                countEl.textContent = q === '' ? '' :
                    (matchCount + (matchCount === 1 ? ' Life found' : ' Lives found'));
            }
        }

        function showCommentaryPopover(refs, x, y) {
            closeCommentaryPopover();

            backdrop.className = 'commentary-popover-backdrop';
            backdrop.addEventListener('click', closeCommentaryPopover);

            const pop = document.createElement('div');
            pop.className = 'commentary-popover';

            const header = document.createElement('div');
            header.className = 'commentary-popover-header';
            header.textContent = 'Commentary on this verse';
            pop.appendChild(header);

            const list = document.createElement('div');
            list.className = 'commentary-popover-list';
            pop.appendChild(list);

            refs.forEach(ref => {
                if (ref.type === 'synaxarion') {
                    const item = document.createElement('button');
                    item.className = 'commentary-popover-item';
                    const author = document.createElement('span');
                    author.className = 'ref-author';
                    author.textContent = ref.author || 'Synaxarion';
                    const work = document.createElement('span');
                    work.textContent = ref.label;
                    item.appendChild(author);
                    item.appendChild(work);
                    item.addEventListener('click', () => {
                        closeCommentaryPopover();
                        openCommentaryRef(ref);
                    });
                    list.appendChild(item);
                } else if (ref.type === 'unavailable') {
                    const item = document.createElement('div');
                    item.className = 'commentary-popover-unavailable';
                    const author = document.createElement('span');
                    author.className = 'ref-author';
                    author.textContent = ref.author;
                    const work = document.createElement('span');
                    work.className = 'ref-work';
                    work.textContent = ref.label;
                    item.appendChild(author);
                    item.appendChild(work);
                    list.appendChild(item);
                } else {
                    const item = document.createElement('button');
                    item.className = 'commentary-popover-item';
                    const author = document.createElement('span');
                    author.className = 'ref-author';
                    author.textContent = ref.author;
                    const work = document.createElement('span');
                    work.textContent = ref.label;
                    item.appendChild(author);
                    item.appendChild(work);
                    item.addEventListener('click', () => {
                        closeCommentaryPopover();
                        openCommentaryRef(ref);
                    });
                    list.appendChild(item);
                }
            });

            document.body.appendChild(backdrop);
            document.body.appendChild(pop);

            if (window.innerWidth > 700) {
                const rect = pop.getBoundingClientRect();
                let left = Math.max(10, Math.min(x, window.innerWidth - rect.width - 10));
                let top = y + 12;
                if (top + rect.height > window.innerHeight - 10) {
                    top = Math.max(10, y - rect.height - 12);
                }
                pop.style.left = left + 'px';
                pop.style.top = top + 'px';
            }

            commentaryPopover = { el: pop, backdrop: backdrop };
        }

        // Dynamic tooltip positioning for footnotes in homily panel
        function initializeFootnoteTooltips() {
            // Remove any existing tooltip
            const existingTooltip = document.querySelector('.footnote-tooltip-dynamic');
            if (existingTooltip) {
                existingTooltip.remove();
            }
            
            // Create a reusable tooltip element
            const tooltip = document.createElement('div');
            tooltip.className = 'footnote-tooltip-dynamic';
            tooltip.style.cssText = `
                position: fixed;
                background: #333;
                color: white;
                padding: 8px 12px;
                border-radius: 4px;
                font-size: 14px;
                z-index: 10001;
                pointer-events: none;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                max-width: 300px;
                min-width: 200px;
                line-height: 1.4;
                display: none;
                font-weight: normal;
            `;
            document.body.appendChild(tooltip);
            
            // Find all footnote references in the homily panel
            const footnotes = document.querySelectorAll('#homilyContent sup.footnote-ref[title]');
            
            footnotes.forEach(footnote => {
                // Remove any existing listeners
                const newFootnote = footnote.cloneNode(true);
                footnote.parentNode.replaceChild(newFootnote, footnote);
                
                newFootnote.addEventListener('mouseenter', function(e) {
                    const title = this.getAttribute('title');
                    if (!title) return;
                    
                    tooltip.textContent = title;
                    tooltip.style.display = 'block';
                    
                    // Get the position of the footnote and the homily panel
                    const rect = this.getBoundingClientRect();
                    const panel = document.getElementById('homilyPanel');
                    const panelRect = panel.getBoundingClientRect();
                    
                    // Initially position below the footnote
                    let left = rect.left;
                    let top = rect.bottom + 5;
                    
                    // Measure tooltip after content is set
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                    const tooltipRect = tooltip.getBoundingClientRect();
                    
                    // Keep tooltip within the homily panel bounds
                    // Check right edge
                    if (left + tooltipRect.width > panelRect.right - 10) {
                        left = panelRect.right - tooltipRect.width - 10;
                    }
                    
                    // Check left edge
                    if (left < panelRect.left + 10) {
                        left = panelRect.left + 10;
                    }
                    
                    // Check bottom edge
                    if (top + tooltipRect.height > window.innerHeight - 20) {
                        // Position above the footnote instead
                        top = rect.top - tooltipRect.height - 5;
                    }
                    
                    // Check top edge
                    if (top < 20) {
                        // Position to the side instead
                        top = rect.top;
                        left = rect.left - tooltipRect.width - 10;
                        
                        // If that goes off the left edge of panel, position to the right
                        if (left < panelRect.left + 10) {
                            left = rect.right + 10;
                        }
                    }
                    
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                });
                
                newFootnote.addEventListener('mouseleave', function() {
                    tooltip.style.display = 'none';
                });
            });
        }
        
        // Call initializeFootnoteTooltips after homily content is loaded
        document.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'homilyContent') {
                setTimeout(initializeFootnoteTooltips, 100);
            }
        });
        
    </script>
</body>
</html>
