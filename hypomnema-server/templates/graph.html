{{define "graph.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Synaxarion graph — Hypomnema</title>
<link rel="icon" href="/static/favicon.svg">
<style>
  :root {
    --bg: #14110e;
    --panel: #1c1815;
    --line: #332c25;
    --ink: #e8e0d4;
    --dim: #9a8f80;
    --gold: #c9a227;
    --doc: #6ba3c9;
    --concept: #c98b6b;
    --rationale: #8fb573;
    --paper: #b07bc9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .panel {
    position: fixed; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px;
  }
  #controls { top: 12px; left: 12px; width: 260px; max-height: calc(100vh - 24px); overflow-y: auto; }
  #detail { top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); overflow-y: auto; display: none; }
  #detail.on { display: block; }

  h1 { font-size: 15px; margin: 0 0 2px; color: var(--gold); font-weight: 600; }
  .sub { font-size: 11px; color: var(--dim); margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 14px 0 6px; font-weight: 600; }

  input[type=search] {
    width: 100%; padding: 6px 8px; background: #100d0b; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; font-size: 13px;
  }
  input[type=search]:focus { outline: none; border-color: var(--gold); }
  label.row { display: flex; align-items: center; gap: 7px; padding: 3px 0;
              font-size: 12.5px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--gold); margin: 0; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  select, button {
    width: 100%; padding: 5px 7px; background: #100d0b; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; font-size: 12.5px;
  }
  button { cursor: pointer; margin-top: 8px; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  .stat { display: flex; justify-content: space-between; font-size: 12px;
          color: var(--dim); padding: 2px 0; }
  .stat b { color: var(--ink); font-weight: 500; }

  #detail .dlabel { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .badge { display: inline-block; font-size: 10px; text-transform: uppercase;
           letter-spacing: .06em; padding: 2px 6px; border-radius: 3px;
           background: #2a231d; color: var(--dim); margin-right: 4px; }
  .nbr { padding: 4px 0; border-top: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .nbr:hover { color: var(--gold); }
  .nbr .rel { font-size: 10.5px; color: var(--dim); }
  a { color: var(--gold); font-size: 12px; }
  #hint { position: fixed; bottom: 12px; left: 12px; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="panel" id="controls">
  <h1>Synaxarion graph</h1>
  <div class="sub">September pilot · {{.Lives}} lives</div>

  <input type="search" id="q" placeholder="Search saints, places, concepts…" autocomplete="off">

  <h2>Node type</h2>
  <label class="row"><input type="checkbox" data-t="document" checked><span class="swatch" style="background:var(--doc)"></span>Lives / documents</label>
  <label class="row"><input type="checkbox" data-t="concept" checked><span class="swatch" style="background:var(--concept)"></span>Entities / places</label>
  <label class="row"><input type="checkbox" data-t="rationale" checked><span class="swatch" style="background:var(--rationale)"></span>Rationale</label>
  <label class="row"><input type="checkbox" data-t="paper" checked><span class="swatch" style="background:var(--paper)"></span>Sources</label>

  <h2>Edges</h2>
  <label class="row"><input type="checkbox" id="fExtracted" checked>EXTRACTED only</label>
  <label class="row"><input type="checkbox" id="fCross">Cross-day links only</label>

  <h2>Colour by</h2>
  <select id="mode">
    <option value="type">Node type</option>
    <option value="comm">Community</option>
    <option value="day">Calendar day</option>
  </select>

  <h2>Community</h2>
  <select id="comm"><option value="-1">All communities</option></select>

  <button id="reset">Reset view</button>

  <h2>Showing</h2>
  <div class="stat"><span>Nodes</span><b id="nN">0</b></div>
  <div class="stat"><span>Edges</span><b id="nE">0</b></div>
  <div class="stat"><span>Cross-day</span><b id="nX">0</b></div>
</div>

<div class="panel" id="detail"></div>
<div id="hint">drag to pan · scroll to zoom · click a node</div>

<script src="/static/graph.js?v={{.AssetVersion}}"></script>
</body>
</html>{{end}}
